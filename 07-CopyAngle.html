<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<title>  复制角 </title>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<script type="text/javascript" src="rc-common.js"></script>


 <script>

  // canvas size, pixels
  var height = 600; 
  var width  = 600; 

  // canvas world bounds
  var xright = 3.0;
  var xleft = -3.0;
  var ytop = 3.0;
  var ybottom = -3.0;

  // Point objects, fields x,y,label
  var s = 2; // side length
  var ss = 2.5; // side length
  var r = 1.5;
  var a = new Object;  a.x = -2; a.y = 1; a.label = "A";
  var b = new Object;  b.x = a.x+s; b.y = a.y; b.label = "B";
  var c = new Object;  c.x = a.x+s; c.y = a.y-1.5; c.label = "C";

  var d = new Object;  d.x = 0.0; d.y = -1; d.label = "D";
  var e = new Object;  e.x = d.x+ss; e.y = d.y; e.label = "E";
  var f = new Object;  f.x = a.x+r; f.y = a.y; f.label = "F";
  var g = new Object;  g.x = a.x+r*(c.x-a.x)/Math.sqrt((c.x-a.x)*(c.x-a.x)+(c.y-a.y)*(c.y-a.y));
                       g.y = a.y+r*(c.y-a.y)/Math.sqrt((c.x-a.x)*(c.x-a.x)+(c.y-a.y)*(c.y-a.y));
                       g.label = "G";
  var h = new Object;  h.x = d.x+r; h.y = d.y; h.label = "H";
  var i = new Object;  i.x = d.x+r*(c.x-a.x)/Math.sqrt((c.x-a.x)*(c.x-a.x)+(c.y-a.y)*(c.y-a.y));
                       i.y = d.y+r*(c.y-a.y)/Math.sqrt((c.x-a.x)*(c.x-a.x)+(c.y-a.y)*(c.y-a.y));
                       i.label = "I";
  rr = Math.sqrt((f.x-g.x)*(f.x-g.x)+(f.y-g.y)*(f.y-g.y));
  var j = new Object;  j.x = d.x+2*(i.x-d.x); j.y = d.y+2*(i.y-d.y); j.label = "J";
  var line1 = new Object;
  var line2 = new Object;
  var gg = new Object;
  var c1 = new Object;
  var c2 = new Object;
  var c3 = new Object;
  
  var movable_pts = [a,b,c,d,e];
  
  function reset()
  { a.x = -2; a.y = 1; 
    b.x = a.x+s; b.y = a.y;
    c.x = a.x+s; c.y = a.y-1.5;
    d.x = 0.0; d.y = -1; 
    e.x = d.x+ss; e.y = d.y;
  }
  
  function calc_points()
  {
    f.x = a.x+0.7*(b.x-a.x); f.y = a.y + 0.7*(b.y-a.y); 
    c1.x = a.x; c1.y = a.y; c1.r = dist(a,f);
    line1.x1 = a.x; line1.y1 = a.y; line1.x2 = c.x; line1.y2 = c.y;
    line_circle(line1,c1,g,gg); if ( dist(gg,c) < dist(g,c) ) swap(g,gg);
    c2.x = d.x; c2.y = d.y; c2.r = c1.r;
    line2.x1 = d.x; line2.y1 = d.y; line2.x2 = e.x; line2.y2 = e.y;
    line_circle(line2,c2,h,gg); if ( dist(h,e) > dist(gg,e) ) swap(h,gg);
    c3.x = h.x; c3.y = h.y; c3.r = dist(f,g);
    circle_circle(c2,c3,i,gg); if ( (i.x-d.x)*(h.y-d.y)-(i.y-d.y)*(h.x-d.x) < 0 ) swap(i,gg);
  }
  
  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();
    
    draw_segment(d,e);
    draw_segment(a,b);
    draw_segment(a,c);
    draw_point(a,"red",W);
    draw_point(b,"red",E);
    draw_point(c,"red",E);
    draw_point(d,"red",W);
    draw_point(e,"red",E);

    if ( draw_stage == 0 ) return;

    angle1 = Math.atan2(b.y-a.y,b.x-a.x);
    angle2 = Math.atan2(c.y-a.y,c.x-a.x);
    draw_arc(a,c1.r,angle2-0.1,angle1+0.1);
    draw_point(f,"black",SE);
    draw_point(g,"black",N);

    if ( draw_stage == 1 ) return;

    angle1 = Math.atan2(e.y-d.y,e.x-d.x);
    angle2 = Math.atan2(i.y-d.y,i.x-d.x);
    draw_arc(d,c2.r,angle2-0.2,angle1+0.2);
    draw_point(h,"black",SE);
   
    if ( draw_stage == 2 ) return;

    draw_segment(f,g);
    angle = Math.atan2(i.y-h.y,i.x-h.x);
    draw_arc(h,c3.r,angle-0.2,angle+0.2);
    draw_point(i,"black",N);

   
    if ( draw_stage == 3 ) return;

    draw_ray(d,i);

  }

  </script>


</head>

<body>
<H3>尺规作图 7<br>
   将角A复制到线段DE
</H3>

<table>
<tr>
<td>
    <canvas id="myCanvas" width="600" height="600"></canvas>
  <td style="vertical-align:top">
  <table>
  <tr>
  <td>
 <input type="radio" name="step" onclick="reset();ddraw(0)" value="0">重置<br>
 <input type="radio" name="step" onclick="ddraw(1)" value="1">1. 以A为圆心，任意半径作圆<br>
 <input type="radio" name="step" onclick="ddraw(2)" value="2">2. 以D为圆心，相同半径作圆<br>
 <input type="radio" name="step" onclick="ddraw(3)" value="3">3. 以H为圆心，半径FG作圆<br>
 <input type="radio" name="step" onclick="ddraw(4)" value="4" id="start">4. 复制角的边DI<br>
<tr><td> 原理说明：
   通过使用相同半径的两段弧，AF = DH且AG = DI。又FG = HI，因此三角形AFG与三角形DHI全等（SSS），所以角A等于角D。

<script>

 // Browser detection, since Chrome seems not to do filltext
   chrome_flag = (navigator.userAgent.indexOf("Chrome") > -1) || (navigator.userAgent.indexOf("Safari") > -1);
   
   document.getElementById("start").checked = true;
   canvas = document.getElementById('myCanvas');
   ctx = canvas.getContext('2d');
   canvas.onmousedown = handleMouseDown;
   document.onmouseup = handleMouseUp;
   document.onmousemove = handleMouseMove;
   draw();

</script>


</body>
</html>
