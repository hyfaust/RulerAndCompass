<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<title> 倍积圆 </title>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<script type="text/javascript" src="rc-common.js"></script>

 <script>

  // canvas size, pixels
  var height = 600; 
  var width  = 600; 

  // canvas world bounds
  var xright = 3.0;
  var xleft = -3.0;
  var ytop = 3.0;
  var ybottom = -3.0;

  // Point objects, fields x,y,label
  var o = new Object;  o.label = "O";
  var a = new Object;  a.label = "A";
  var b = new Object;  b.label = "B";
  var c = new Object;  c.label = "C";
  var d = new Object;  d.label = "D";

  var c1 = new Object;
  var c2 = new Object;
  var c3 = new Object;

  var movable_pts = [a,o];
    
  function reset()
  { o.x = 0; o.y = 0; 
    a.x = o.x-1.0; a.y = o.y;
  }
  
  reset();
  
  function calc_points()
  { b.x = a.x + 2*(o.x-a.x); b.y = a.y + 2*(o.y-a.y);
    c1.x = a.x; c1.y = a.y; c1.r = dist(a,b);
    c2.x = b.x; c2.y = b.y; c2.r = c1.r;
    c3.x = o.x; c3.y = o.y; c3.r = dist(a,o);
    circle_circle(c1,c2,c,d); 
    if ( (c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x) < 0 ) swap(c,d);
    d.x = o.x + (o.y-a.y); d.y = o.y - (o.x-a.x);
    
  
  }
  
  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();
    
    draw_point(o,"red",NE);
    draw_point(a,"red",W);
    draw_arc(o,dist(a,o),0,2*Math.PI);

    if ( draw_stage == 0 ) return;

    draw_segment(a,b);
    draw_point(b,"black",E);

    if ( draw_stage == 1 ) return;

    angle = Math.atan2(c.y-a.y,c.x-a.x);
    draw_arc(a,dist(a,c),angle-0.2,angle+0.2);

    if ( draw_stage == 2 ) return;

    angle = Math.atan2(c.y-b.y,c.x-b.x);
    draw_arc(b,dist(b,c),angle-0.2,angle+0.2);
    draw_point(c,"black",N);
   
    if ( draw_stage == 3 ) return;

    draw_segment(o,c);
    draw_point(d,"black",NE);


    if ( draw_stage == 4 ) return;

    draw_segment(d,b);

    if ( draw_stage == 5 ) return;

    draw_arc(d,dist(d,b),0,2*Math.PI);

 
  }

  </script>


</head>

<body>
<H3>尺规作图 21 <br>
  将给定圆的面积加倍
</H3>

<table>
<tr>
<td>
    <canvas id="myCanvas" width="600" height="600"></canvas>
  <td style="vertical-align:top">
  <table>
  <tr>
  <td>
 <input type="radio" name="step" onclick="reset();ddraw(0)" value="0">重置<br>
 <input type="radio" name="step" onclick="ddraw(1)" value="1">1. 直径 AB <br>
 <input type="radio" name="step" onclick="ddraw(2)" value="2">2. 以 A 为圆心，任意半径作弧<br>
 <input type="radio" name="step" onclick="ddraw(3)" value="3">3. 以 B 为圆心，相同半径作弧<br>
 <input type="radio" name="step" onclick="ddraw(4)" value="4">4. 线段 OC，垂直于 AB <br>
 <input type="radio" name="step" onclick="ddraw(5)" value="5">5. 线段 DB，长度为 √2·OB <br>
 <input type="radio" name="step" onclick="ddraw(6)" value="6" id="start">6. 以 D 为圆心，过 B 作圆<br>
<tr><td> 原理说明：
原圆的面积为 πR²，因此我们需要一个面积为 2πR² 的圆。设新圆的半径为 s，则 πs² = 2πR²，即 s = R·√2，这正是两条互相垂直的半径所构成的直角三角形的斜边长度。
