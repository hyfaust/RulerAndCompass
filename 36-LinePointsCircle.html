<html lang="zh-CN">
<head>
<title>   与两点和一条线相切的圆 </title>

<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<script type="text/javascript" src="rc-common.js"></script>
 <script>


  // Point objects, fields x,y,label
  var s = 3; // side length
  var r = 1.0;
  var rr = 2.5;
  var a = new Object;  a.x = -2; a.y = -2; a.label = "A";
  var b = new Object;  b.x = 1; b.y = 0; b.label = "B";
  var c = new Object;  c.x = 0; c.y = 0; c.label = "C";
  var d = new Object;  d.x = 0; d.y = 0; d.label = "D";
  var e = new Object;  e.x = 0; e.y = 0; e.label = "E";
  var f = new Object;  f.x = 0; f.y = 0; f.label = "F";
  var g = new Object;  g.x = 0; g.y = 0; g.label = "G";
  var h = new Object;  h.x = 0; h.y = 0; h.label = "H";
  var i = new Object;  i.x = 0; i.y = 0; i.label = "I";
  var j = new Object;  j.x = 0; j.y = 0; j.label = "J";
  var k = new Object;  k.x = 0; k.y = 0; k.label = "K";
  var l = new Object;  l.x = 0; l.y = 0; l.label = "L";
  var m = new Object;  m.x = 0; m.y = 0; m.label = "M";
  var n = new Object;  n.x = 0; n.y = 0; n.label = "N";
  var o = new Object;  o.x = 0; o.y = 0; o.label = "O";
  var p = new Object;  p.x = 0; p.y = 0; p.label = "P";
  var q = new Object;  q.x = 0; q.y = 0; q.label = "Q";

  // Line objects, fields x1,y1,x2,y2
  var L1 = new Object; L1.x1=-2; L1.y1=1; L1.x2=2; L1.y2 = 1;
  var L2 = new Object;
  var L3 = new Object;
  var L4 = new Object;
  var L5 = new Object;
  var L6 = new Object;
  var L7 = new Object;
  var L8 = new Object;
  var L9 = new Object;

  // Circle objects, fields x,y,r
  var c1 = new Object;
  var c2 = new Object;
  var c3 = new Object;
  var c4 = new Object;
  var c5 = new Object;
  var c6 = new Object;
  var c7 = new Object;
  var c8 = new Object;
  var c9 = new Object;

  var movable_pts = [a,b];
  
  function reset()
  { a.x = -2; a.y = -2;
    b.x = 1; b.y = 0; 
  }
  
  reset();
  
  function calc_points() // calculate entire construction
  { 
    L2.x1 = a.x; L2.y1 = a.y; L2.x2 = b.x; L2.y2 = b.y;
    line_line(L1,L2,c);
    d.x = (a.x+b.x)/2; d.y = (a.y+b.y)/2;
    perp_to_line(d,a,L3);
    e.x = (a.x+c.x)/2; e.y = (a.y+c.y)/2;
    c1.x = e.x; c1.y = e.y; c1.r = dist(e,a);
    perp_to_line(b,a,L4);
    line_circle(L4,c1,f,g); if (f.y > g.y) { f.x = g.x; f.y = g.y; }
    c2.x = c.x; c2.y = c.y; c2.r = dist(c,f);
    line_circle(L1,c2,g,h); if ( g.x > h.x ) { g.x = h.x; g.y = h.y; }
    perp_to_line(g,c,L5);
    line_line(L3,L5,h);
  }

  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();

    draw_point(a,"red",N);
    draw_point(b,"red",W);
    draw_line_L(L1);

    if ( draw_stage == 0 ) return;

    draw_point(c,"black",N);
    draw_line_L(L2);

    if ( draw_stage == 1 ) return;

    draw_point(d,"black",N);
    draw_line_L(L3);

    if ( draw_stage == 2 ) return;

    draw_point(e,"black",NE);
   
    if ( draw_stage == 3 ) return;

    draw_arc(e,dist(e,a),0,2*Math.PI);

    if ( draw_stage == 4 ) return;

    draw_line_L(L4);
    draw_point(f,"black",N);

    if ( draw_stage == 5 ) return;

    draw_arc(c,dist(c,f),0,2*Math.PI);
    draw_point(g,"black",NW);

    if ( draw_stage == 6 ) return;

    draw_line_L(L5);
    draw_point(h,"black",W);

    if ( draw_stage == 7 ) return;

    draw_arc(h,dist(h,a),0,2*Math.PI);

  }

  </script>


</head>

<body>
<H3>尺规作图 36 <br>

<table>

<td>
    <canvas id="myCanvas" width="600" height="600"></canvas>
  <td style="vertical-align:top">

  <td>
 <input type="radio" name="step" onclick="reset();ddraw(0)" value="0">重置<br>
 <input type="radio" name="step" onclick="ddraw(1)" value="1">1. 直线 AB <br>
 <input type="radio" name="step" onclick="ddraw(2)" value="2">2. 过 AB 中点 D 作 AB 的垂线<br>
 <input type="radio" name="step" onclick="ddraw(3)" value="3">3. AC 的中点 E<br>
 <input type="radio" name="step" onclick="ddraw(4)" value="4">4. 以 E 为圆心，过 C 作圆<br>
 <input type="radio" name="step" onclick="ddraw(5)" value="5">5. 过 B 作 AB 的垂线<br>
 <input type="radio" name="step" onclick="ddraw(6)" value="6">6. 以 C 为圆心，过 F 作圆<br>
 <input type="radio" name="step" onclick="ddraw(7)" value="7">7. 过 G 作原直线的垂线<br>
 <input type="radio" name="step" onclick="ddraw(8)" value="8" id="start">8. 以 H 为圆心，过 A 作圆<br>
