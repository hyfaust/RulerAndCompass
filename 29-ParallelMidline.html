<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<title>平行中位线</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<script type="text/javascript" src="rc-common.js"></script>

 <script>

  // canvas size, pixels
  var height = 600; 
  var width  = 600; 

  // canvas world bounds
  var xright = 3.0;
  var xleft = -3.0;
  var ytop = 3.0;
  var ybottom = -3.0;

  // Point objects, fields x,y,label
  var s = 3; // side length
  var r = 1.6;
  var rr = 2.5;

  var a = new Object;   a.label = "A";
  var b = new Object;   b.label = "B";
  var c = new Object;   c.label = "C";
  var d = new Object;   d.label = "D";
  var e = new Object;   e.label = "E";
  var f = new Object;   f.label = "F";
  var g = new Object;   g.label = "G";
  var h = new Object;   h.label = "H";
  var i = new Object;   i.label = "I";
  var j = new Object;   j.label = "J";

  var c1 = new Object;
  var c2 = new Object;
  var c3 = new Object;
  var c4 = new Object;
     
  var movable_pts = [a,b,f,g];
    
  function reset()
  { a.x = -2; a.y = 1; 
    b.x = 0; b.y = -1;
    f.x = 0; f.y = 1;
    g.x = 1.5; g.y = -1;
  }
  
  reset();
  
  function calc_points()
  { bg = dist(b,g);
    g.x = b.x + bg*(f.x-a.x)/dist(f,a);
    g.y = b.y + bg*(f.y-a.y)/dist(f,a);
    c.x = (b.x+a.x)/2; c.y = (b.y+a.y)/2;
    j.x = (f.x+g.x)/2; j.y = (f.y+g.y)/2;
    c1.x = a.x; c1.y = a.y; c1.r = 1.1*dist(a,c);
    c2.x = b.x; c2.y = b.y; c2.r = 1.1*dist(a,c);
    c3.x = f.x; c3.y = f.y; c3.r = 1.1*dist(j,f);
    c4.x = g.x; c4.y = g.y; c4.r = 1.1*dist(j,f);
    circle_circle(c1,c2,d,e);
    circle_circle(c3,c4,h,i);
  }
  
  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();
    
    draw_line(a,f);
    draw_line(b,g);

    if ( draw_stage == 0 ) return;

    draw_point(a,"red",NW);
    draw_point(b,"red",N);

    draw_segment(a,b);

    if ( draw_stage == 1 ) return;

    angle1 = Math.atan2(d.y-a.y,d.x-a.x);
    angle2 = Math.atan2(e.y-a.y,e.x-a.x);
    draw_arc(a,dist(a,d),angle1-0.2,angle2+0.2);

    angle1 = Math.atan2(e.y-b.y,e.x-b.x);
    angle2 = Math.atan2(d.y-b.y,d.x-b.x);
    draw_arc(b,dist(b,d),angle1-0.2,angle2+0.2);

    draw_point(e,"black",NE);
    draw_point(d,"black",NE);
    draw_segment(e,d);
    draw_point(c,"black",N);

    if ( draw_stage == 2 ) return;

    draw_point(f,"red",S);
    draw_point(g,"red",S);

    draw_segment(f,g);

    if ( draw_stage == 3 ) return;

    angle1 = Math.atan2(h.y-f.y,h.x-f.x);
    angle2 = Math.atan2(i.y-f.y,i.x-f.x);
    draw_arc(f,dist(f,h),angle1-0.2,angle2+0.2);

    angle1 = Math.atan2(i.y-g.y,i.x-g.x);
    angle2 = Math.atan2(h.y-g.y,h.x-g.x);
    draw_arc(g,dist(g,h),angle1-0.2,angle2+0.2);

    draw_point(h,"black",NE);
    draw_point(i,"black",NE);
    draw_segment(h,i);
    draw_point(j,"black",N);

    if ( draw_stage == 4 ) return;

    draw_line(c,j);


  }

  </script>


</head>

<body>
<H3>尺规作图 29<br>
  两平行线间的中位线
</H3>

<table>
<tr>
<td>
    <canvas id="myCanvas" width="600" height="600"></canvas>
  <td style="vertical-align:top">
  <table>
  <tr>
  <td>
 <input type="radio" name="step" onclick="reset();ddraw(0)" value="0">重置<br>
 <input type="radio" name="step" onclick="ddraw(1)" value="1">1. 任意截线段 AB<br>
 <input type="radio" name="step" onclick="ddraw(2)" value="2">2. AB 的中点 C
     (<a href="01-PerpBisector.html">作图 1</a><br>
 <input type="radio" name="step" onclick="ddraw(3)" value="3">3. 任意截线段 FG<br>
 <input type="radio" name="step" onclick="ddraw(4)" value="4">4. FG 的中点 J<br>
 <input type="radio" name="step" onclick="ddraw(5)" value="5" id="start">5. 直线 CJ<br>
<tr><td> 原理说明：
   平行线按等比切割截线，反之亦然，因此连接任意两条截线段的中点，所得直线即为与原两线平行且等距的中位线。

</script>

</html>
