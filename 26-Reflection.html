<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<title>反射</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<script type="text/javascript" src="rc-common.js"></script>

 <script>

  // canvas size, pixels
  var height = 600; 
  var width  = 600; 

  // canvas world bounds
  var xright = 3.0;
  var xleft = -3.0;
  var ytop = 3.0;
  var ybottom = -3.0;


  // Point objects, fields x,y,label
  var s = 1.3; // distance from mirror
  var r = 1.0;
  var rr = 2.5;
  var a = new Object;  a.x = -2; a.y = 0; a.label = "A";
  var b = new Object;  b.x = 0.5; b.y = a.y; b.label = "B";
  var c = new Object;  c.x = -1; c.y = a.y-s; c.label = "C";

  var d = new Object;  d.x = c.x; d.y = a.y+s; d.label = "D";
  var e = new Object;  e.x = 2; e.y = a.y-1.8; e.label = "E";

  var f = new Object;  f.x = d.x+(a.y-d.y)/(e.y-d.y)*(e.x-d.x); f.y = a.y; f.label = "F";

  var g = new Object;  g.x = 0; g.y = 0; g.label = "G";
  var h = new Object;  h.x = 0; h.y = 0; h.label = "H";
  var i = new Object;  i.x = 0; i.y = 0; i.label = "I";
  var j = new Object;  j.x = 0; j.y = 0; j.label = "J";
  var k = new Object;  k.x = 0; k.y = 0; k.label = "K";
  var l = new Object;  l.x = 0; l.y = 0; l.label = "L";
  var m = new Object;  m.x = 0; m.y = 0; m.label = "M";
  var n = new Object;  n.x = 0; n.y = 0; n.label = "N";
  var o = new Object;  o.x = 0; o.y = 0; o.label = "O";
  var p = new Object;  p.x = 0; p.y = 0; p.label = "P";
  var q = new Object;  q.x = 0; q.y = 0; q.label = "Q";
  var c1 = new Object;
  var c2 = new Object;
  var c3 = new Object;
  var line1 = new Object;
  var line2 = new Object;
   
  var movable_pts = [a,b,c,e];
    
  function reset()
  {  a.x = -2; a.y = 0; 
     b.x = 2.5; b.y = a.y;
     c.x = 0; c.y = a.y-s;
     e.x = 2; e.y = a.y-1.8;
  }
  
  reset();
  
  function calc_points()
  {  c1.x = a.x; c1.y = a.y, c1.r = dist(a,c);
     c2.x = b.x; c2.y = b.y; c2.r = dist(b,c);
     circle_circle(c1,c2,d,q); if ( dist(d,c) < dist(q,c) ) swap(d,q);
     line1.x1 = a.x; line1.y1 = a.y; line1.x2 = b.x; line1.y2 = b.y;
     line2.x1 = d.x; line2.y1 = d.y; line2.x2 = e.x; line2.y2 = e.y;
     line_line(line1,line2,f);
  }
  
  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();
    
    draw_line(a,b);
    draw_point(c,"red",E); 
    draw_point(e,"red",NE);
    
    if ( draw_stage == 0 ) return;

    draw_point(a,"red",N);

    if ( draw_stage == 1 ) return;

    angle1 = Math.atan2(c.y-a.y,c.x-a.x);
    angle2 = Math.atan2(d.y-a.y,d.x-a.x);
    draw_arc(a,dist(a,c),angle1-0.2,angle2+0.2);

    if ( draw_stage == 2 ) return;

    draw_point(b,"red",N);
   
    if ( draw_stage == 3 ) return;

    angle1 = Math.atan2(d.y-b.y,d.x-b.x);
    angle2 = Math.atan2(c.y-b.y,c.x-b.x);
    draw_arc(b,dist(b,c),angle1-0.2,angle2+0.2);

    if ( draw_stage == 4 ) return;

    draw_point(d,"black",E);
    
    if ( draw_stage == 5 ) return;

    draw_segment(d,e);

    if ( draw_stage == 6 ) return;

    draw_point(f,"black",SE);

    if ( draw_stage == 7 ) return;

    draw_segment(c,f);

  }

  </script>


</head>

<body>
<H3>尺规作图 26<br>
  两点间光线的镜面反射
</H3>

<table>
<tr>
<td>
    <canvas id="myCanvas" width="600" height="600"></canvas>
  <td style="vertical-align:top">
  <table>
  <tr>
  <td>
 <input type="radio" name="step" onclick="reset();ddraw(0)" value="0">重置<br>
 <input type="radio" name="step" onclick="ddraw(1)" value="1">1. 直线上任意点 A<br>
 <input type="radio" name="step" onclick="ddraw(2)" value="2">2. 以 A 为圆心，过 C 作弧<br>
 <input type="radio" name="step" onclick="ddraw(3)" value="3">3. 直线上任意点 B<br>
 <input type="radio" name="step" onclick="ddraw(4)" value="4">4. 以 B 为圆心，过 C 作弧<br>
 <input type="radio" name="step" onclick="ddraw(5)" value="5">5. 镜像点 D<br>
 <input type="radio" name="step" onclick="ddraw(6)" value="6">6. 线段 DE<br>
 <input type="radio" name="step" onclick="ddraw(7)" value="7">7. 反射点 F<br>
 <input type="radio" name="step" onclick="ddraw(8)" value="8" id="start">8. 光线路径 CFE<br>
<tr><td>
   反射后的光线从 E 看起来像是直接射向 C 的镜像点 D，因此只需构造 C 的镜像点，然后从 E 向该点作直线即可。

   chrome_flag = (navigator.userAgent.indexOf("Chrome") > -1) || (navigator.userAgent.indexOf("Safari") > -1);

   draw();
