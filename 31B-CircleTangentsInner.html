 <script>


  // Point objects, fields x,y,label
  var s = 3; // side length
  var r = 1.0;
  var rr = 2.5;
  var a = new Object;  a.x = -1.7; a.y = 0; a.label = "A";
  var b = new Object;  b.x = 1.5; b.y = a.y; b.label = "B";
  var c = new Object;  c.x = 0; c.y = 0; c.label = "C";
  var d = new Object;  d.x = 0; d.y = 0; d.label = "D";
  var e = new Object;  e.x = 0; e.y = 0; e.label = "E";
  var f = new Object;  f.x = 0; f.y = 0; f.label = "F";
  var g = new Object;  g.x = 0; g.y = 0; g.label = "G";
  var h = new Object;  h.x = 0; h.y = 0; h.label = "H";
  var i = new Object;  i.x = 0; i.y = 0; i.label = "I";
  var j = new Object;  j.x = 0; j.y = 0; j.label = "J";
  var k = new Object;  k.x = 0; k.y = 0; k.label = "K";
  var l = new Object;  l.x = 0; l.y = 0; l.label = "L";
  var m = new Object;  m.x = 0; m.y = 0; m.label = "M";
  var n = new Object;  n.x = 0; n.y = 0; n.label = "N";
  var o = new Object;  o.x = 0; o.y = 0; o.label = "O";
  var p = new Object;  p.x = 0; p.y = 0; p.label = "P";
  var q = new Object;  q.x = 0; q.y = 0; q.label = "Q";

  // Line objects, fields x1,y1,x2,y2
  var L1 = new Object;
  var L2 = new Object;
  var L3 = new Object;
  var L4 = new Object;
  var L5 = new Object;
  var L6 = new Object;
  var L7 = new Object;
  var L8 = new Object;
  var L9 = new Object;

  // Circle objects, fields x,y,r
  var c1 = new Object; c1.x = a.x; c1.y = a.y; c1.r = 1.2;
  var c2 = new Object; c2.x = b.x; c2.y = b.y; c2.r = 1.0;
  var c3 = new Object;
  var c4 = new Object;
  var c5 = new Object;
  var c6 = new Object;
  var c7 = new Object;
  var c8 = new Object;
  var c9 = new Object;

  var movable_pts = [a,b];
  
  function reset()
  { a.x = -1.7; a.y = 0; 
    b.x = 1.5; b.y = a.y; 
    c1.x = a.x; c1.y = a.y; c1.r = 1.2;
    c2.x = b.x; c2.y = b.y; c2.r = 1.0;
  }
  
  reset();
  
  function calc_points() // calculate entire construction
  {
    perp_to_line(a,b,L1);
    perp_to_line(b,a,L2);
    c1.x = a.x; c1.y = a.y; c1.r = 1.2;
    c2.x = b.x; c2.y = b.y; c2.r = 1.0;    
    line_circle(L1,c1,c,m); if ( m.y < c.y ) { c.x = m.x; c.y = m.y; }
    line_circle(L2,c2,d,m); if ( m.y > d.y ) { d.x = m.x; d.y = m.y; }
    L3.x1 = a.x; L3.y1 = a.y; L3.x2 = b.x; L3.y2 = b.y;
    L4.x1 = c.x; L4.y1 = c.y; L4.x2 = d.x; L4.y2 = d.y;
    line_line(L3,L4,e);
    f.x = (a.x+e.x)/2; f.y = (a.y+e.y)/2;
    c3.x = f.x, c3.y = f.y; c3.r = dist(f,a);
    circle_circle(c1,c3,g,h);

  }

  function draw()
  {  
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "white";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";

    ctx.scale(100,100);  // keep y going down so text is right side up
    ctx.translate(3,3);
    
    ctx.font="0.15px Verdana";

    calc_points();

    draw_point(a,"red",NW);
    draw_point(b,"red",NW);
    draw_arc(a,c1.r,0,2*Math.PI);
    draw_arc(b,c2.r,0,2*Math.PI);

    if ( draw_stage == 0 ) return;

    draw_ray(a,b);

    if ( draw_stage == 1 ) return;

    draw_line_L(L1);
    draw_line_L(L2);

    if ( draw_stage == 2 ) return;

    draw_point(c,"black",NW);
    draw_point(d,"black",NE);
   
    if ( draw_stage == 3 ) return;

    draw_ray(c,d);
    draw_point(e,"black",NE);

    if ( draw_stage == 4 ) return;

    draw_point(f,"black",N);

    if ( draw_stage == 5 ) return;

    draw_arc(f,dist(f,a),0,2*Math.PI);

    if ( draw_stage == 6 ) return;

    draw_point(g,"black",NE);
    draw_point(h,"black",SE);

    if ( draw_stage == 7 ) return;

    draw_line(e,g);
    draw_line(e,h);

  }

  </script>


</head>
